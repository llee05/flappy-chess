name: Build and publish browser game

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Compile, test, and package all platforms
        run: ./gradlew build
      - name: Test browser gameplay and project-site asset paths
        run: ./gradlew :web:browserTest
        env:
          CHROME_BIN: google-chrome
      - name: Install local signaling for multiplayer checks
        run: npm ci --prefix web --ignore-scripts --no-audit --no-fund
      - name: Test WebRTC multiplayer in two browsers
        run: ./gradlew :web:peerTest
        env:
          CHROME_BIN: google-chrome
      - name: Upload browser distribution
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/build/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
